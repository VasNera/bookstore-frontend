server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Κάθε διαδρομή που δεν είναι πραγματικό αρχείο πάει στο index.html
    # (το React Router φτιάχνει τη σελίδα στον browser)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Τα αρχεία του build έχουν hash στο όνομα (π.χ. index-a1b2c3.js),
    # άρα μπορούν να μείνουν στην cache του browser για πάντα
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}